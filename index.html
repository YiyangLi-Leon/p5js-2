      padding: 10px;
      border-radius: 8px;
      max-width: 400px;
      z-index: 10;
    }
    #editor textarea {
      width: 100%;
      height: 80px;
    }
    #controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
      font-size: 14px;
    }
    canvas { display: block; }
