<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Magnet Letters</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; overflow: hidden; }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 10px;
      z-index: 10;
      width: 240px;
      font-size: 14px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="controls">
    <label>Font Size: <input type="number" id="fontSize" value="20" min="10" max="80"></label><br>
    <label>Line Spacing: <input type="number" id="lineSpacing" value="28" min="10" max="100"></label><br>
    <label>Easing: <input type="range" id="easing" value="0.1" min="0.01" max="0.3" step="0.01"></label><br>
    <label>Font Color: <input type="color" id="fontColor" value="#000000"></label><br>
    <label>Background: <input type="color" id="bgColor" value="#ffffff"></label><br>
  </div>

  <script>
    let letters = [];
    let font;
    let fontSize = 20;
    let lineSpacing = 28;
    let easing = 0.1;
    let fontColor = '#000000';
    let bgColor = '#ffffff';
    let centerIndex = -1;
    let activateFrame = [];
    let frameCounter = 0;

    const textStr = `IntheSbus,intherushhour.Achapofabout26,felt
    hatwithacordinsteadofaribbon,necktoolong,asifsomeone’s
    beenhavingatug-of-warwithit.Peoplegettingoff.Thechapin
    questiongetsannoyedwithoneofthemenstandingnexttohim.
    Heaccuseshimofjostlinghimeverytimeanyonegoespast.
    Asnivellingtonewhichismeanttobeaggressive.Whenhesee
    savacantseathethrows himselfontoit.Twohourslater,Im
    eet himintheCourdeRome,infrontofthegareSaint-Lazare.
    He’swithafriendwho’ssaying:“Yououghttogetanextrabut
    tonputonyourovercoat.”Heshowshimwhere(atthelapels)
    andwhy.`.replace(/\s+/g, '');

    function preload() {
      font = loadFont('https://cdnjs.cloudflare.com/ajax/libs/topcoat/0.8.0/font/SourceCodePro-Regular.otf');
    }

    function setup() {
      createCanvas(1040, 735);
      textFont(font);
      textSize(fontSize);
      layoutLetters();

      document.getElementById('fontSize').addEventListener('input', () => {
        fontSize = parseInt(document.getElementById('fontSize').value);
        textSize(fontSize);
        layoutLetters();
      });
      document.getElementById('lineSpacing').addEventListener('input', () => {
        lineSpacing = parseInt(document.getElementById('lineSpacing').value);
        layoutLetters();
      });
      document.getElementById('easing').addEventListener('input', () => {
        easing = parseFloat(document.getElementById('easing').value);
      });
      document.getElementById('fontColor').addEventListener('input', () => {
        fontColor = document.getElementById('fontColor').value;
      });
      document.getElementById('bgColor').addEventListener('input', () => {
        bgColor = document.getElementById('bgColor').value;
      });
    }

    function layoutLetters() {
      letters = [];
      let usableWidth = width - 40;
      let usableHeight = height - 40;
      let totalLetters = textStr.length;
      let lettersPerRow = floor(sqrt(totalLetters * usableWidth / usableHeight));
      let totalRows = ceil(totalLetters / lettersPerRow);
      let spacingX = usableWidth / (lettersPerRow - 1);
      let x0 = 20, y0 = 20;

      for (let i = 0; i < totalLetters; i++) {
        let col = i % lettersPerRow;
        let row = floor(i / lettersPerRow);
        let x = x0 + col * spacingX;
        let y = y0 + row * lineSpacing;
        let bounds = font.textBounds(textStr[i], 0, 0, fontSize);
        letters.push({
          char: textStr[i],
          x: x,
          y: y,
          baseX: x,
          baseY: y,
          targetX: x,
          row: row,
          width: bounds.w,
          active: false
        });
      }
    }

    function draw() {
      background(bgColor);
      fill(fontColor);
      textFont(font);
      textSize(fontSize);

      if (centerIndex !== -1) {
        updateActivation();
        applyMagnetLayout(centerIndex);
      }

      for (let l of letters) {
        if (l.active) {
          let diff = l.targetX - l.x;
          if (abs(diff) < 0.5) l.x = l.targetX;
          else l.x += diff * easing;
        }
        l.y = l.baseY;
        text(l.char, round(l.x), l.y);
      }

      frameCounter++;
    }

    function mousePressed() {
      centerIndex = findClickedLetter(mouseX, mouseY);
      if (centerIndex !== -1) {
        frameCounter = 0;
        setupActivation(centerIndex);
      }
    }

    function findClickedLetter(mx, my) {
      for (let i = 0; i < letters.length; i++) {
        let l = letters[i];
        if (dist(mx, my, l.x + l.width/2, l.y + 10) < 10) {
          return i;
        }
      }
      return -1;
    }

    function setupActivation(centerIdx) {
      activateFrame = new Array(letters.length).fill(Infinity);
      letters.forEach(l => l.active = false);
      let centerRow = letters[centerIdx].row;
      let rowLetters = [];
      for (let i = 0; i < letters.length; i++) {
        if (letters[i].row === centerRow) rowLetters.push({ index: i, letter: letters[i] });
      }
      let centerInRowIdx = rowLetters.findIndex(l => l.index === centerIdx);
      activateFrame[centerIdx] = 0;
      for (let layer = 1;; layer++) {
        let moved = false;
        let leftIdx = centerInRowIdx - layer;
        let rightIdx = centerInRowIdx + layer;
        if (leftIdx >= 0) {
          activateFrame[rowLetters[leftIdx].index] = layer * 10;
          moved = true;
        }
        if (rightIdx < rowLetters.length) {
          activateFrame[rowLetters[rightIdx].index] = layer * 10;
          moved = true;
        }
        if (!moved) break;
      }
    }

    function updateActivation() {
      for (let i = 0; i < letters.length; i++) {
        if (frameCounter >= activateFrame[i]) {
          letters[i].active = true;
        }
      }
    }
  </script>
</body>
</html>
